name: Build test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Version code = commits on main x 10, so newer builds always install over older ones (releases add 1).
      - run: echo "VV_VERSION_CODE=$(( $(git rev-list --count HEAD) * 10 ))" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Unit tests and debug APK
        env:
          # Optional: add a TMDB_ACCESS_TOKEN repository secret to fill every Movies and TV Series tile.
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: gradle --no-daemon --stacktrace testReleaseUnitTest assembleRelease
      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk VantaView-test.apk
          # The app's update check reads this to tell whether a build is newer than the one installed.
          echo "$VV_VERSION_CODE" > version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VantaView-test-apk
          path: VantaView-test.apk
      - name: Release notes (what's new, then build details after a --- line)
        run: |
          {
            cat docs/WHATS-NEW.md
            echo
            echo "---"
            echo "Test build ${{ github.run_number }} from commit ${{ github.sha }}."
            echo "Signed with a shared test key. Source: this repository (GPL-3.0-or-later)."
          } > release-notes.md
          # The same notes in each language the app speaks, for the update card.
          for f in docs/whats-new/*.md; do cp "$f" "whats-new-$(basename "$f")"; done
      - name: Publish as the "test-latest" pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-latest
          name: VantaView test build
          prerelease: true
          files: |
            VantaView-test.apk
            version.txt
            whats-new-*.md
          body_path: release-notes.md
