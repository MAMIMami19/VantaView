name: Build test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Unit tests and debug APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VantaView-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VantaView-test-apk
          path: VantaView-test.apk
      - name: Publish as the "test-latest" pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-latest
          name: VantaView test build
          prerelease: true
          files: VantaView-test.apk
          body: |
            Test build ${{ github.run_number }} from commit ${{ github.sha }}.
            Early slice: terms, add playlist (M3U / Xtream), Live TV list, player.
            Signed with a shared test key. Source: this repository (GPL-3.0-or-later).
