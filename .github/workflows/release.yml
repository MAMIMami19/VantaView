name: Release

# Publish a release: push a tag like v0.1.0, or run this workflow by hand with a version.
# Notes come from docs/releases/v<version>.md.
#
# Two rules so the permanent download link (and Downloader codes) always get the newest version:
#   1. The APK is always called VantaView.apk.
#   2. Every release is the latest release, never a pre-release.
# Permanent link: https://github.com/wardy-uk1/VantaView/releases/latest/download/VantaView.apk
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Version from tag
        run: |
          V="${{ inputs.version }}"; [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          echo "VV_VERSION=$V" >> $GITHUB_ENV
          echo "VV_VERSION_CODE=$(( $(git rev-list --count HEAD) * 10 + 1 ))" >> $GITHUB_ENV
      - name: Unit tests and APK
        env:
          # Optional: add a TMDB_ACCESS_TOKEN repository secret to fill every Movies and TV Series tile.
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
        run: gradle --no-daemon --stacktrace testReleaseUnitTest assembleRelease
      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk VantaView.apk
          echo "$VV_VERSION_CODE" > version.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VV_VERSION }}
          target_commitish: ${{ github.sha }}
          name: VantaView ${{ env.VV_VERSION }}
          body_path: docs/releases/v${{ env.VV_VERSION }}.md
          prerelease: false
          make_latest: true
          files: |
            VantaView.apk
            version.txt
