name: Release

# Push a tag like v0.1.0 to publish a release. Notes come from docs/releases/<tag>.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Version from tag
        run: |
          echo "VV_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          echo "VV_VERSION_CODE=$(( $(git rev-list --count HEAD) * 10 + 1 ))" >> $GITHUB_ENV
      - name: Unit tests and APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "VantaView-${VV_VERSION}.apk"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: VantaView ${{ env.VV_VERSION }}
          body_path: docs/releases/${{ github.ref_name }}.md
          prerelease: false
          make_latest: true
          files: VantaView-${{ env.VV_VERSION }}.apk
