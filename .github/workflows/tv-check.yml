name: TV check

# Run by hand: install the latest test build on Android TV emulators, drive it with the
# remote's keys, and save screenshots and any crash log. Also runs Android Lint for TV issues.
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      list_images:
        description: "Only list the TV emulator images"
        required: false
        default: "false"

jobs:
  images:
    if: inputs.list_images == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list 2>/dev/null | grep -iE "system-images;android-[0-9]+;(android-tv|google-tv)" | sort -u

  tv:
    if: inputs.list_images != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Android 9 is what Fire TV (Fire OS 7) is built on; Google TV 14 is current Android TV.
        include:
          - name: android9-tv
            api: 28
            target: android-tv
          - name: googletv14
            api: 34
            target: google-tv
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Latest test build
        run: gh release download test-latest -p VantaView-test.apk -R ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          script: bash .github/tv/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-${{ matrix.name }}
          path: tv-out
      # Also keep the screenshots on a branch, so they can be looked at without downloading artifacts.
      - name: Save screenshots to the tv-results branch
        if: always()
        run: |
          git config user.name "tv-check"; git config user.email "tv-check@users.noreply.github.com"
          git fetch origin tv-results || true
          git worktree add -B tv-results ../results origin/tv-results 2>/dev/null || git worktree add --orphan -b tv-results ../results
          rm -rf ../results/${{ matrix.name }}; mkdir -p ../results/${{ matrix.name }}
          cp tv-out/*.png tv-out/*.txt ../results/${{ matrix.name }}/ 2>/dev/null || true
          cd ../results && git add -A && git commit -qm "TV check: ${{ matrix.name }}" && for i in 1 2 3; do git pull --rebase -q origin tv-results 2>/dev/null; git push -q origin tv-results && break; sleep 5; done

  lint:
    if: inputs.list_images != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle --no-daemon lintDebug -Plint.abortOnError=false || true
      - name: Lint summary
        run: |
          f=app/build/reports/lint-results-debug.xml
          echo "== issues by type =="; grep -o 'id="[^"]*"' $f | sort | uniq -c | sort -rn
          echo "== errors and TV/focus related =="
          python3 - <<'PY'
          import re
          x=open('app/build/reports/lint-results-debug.xml').read()
          for m in re.finditer(r'<issue\s(.*?)>\s*<location\s(.*?)/>', x, re.S):
              a,l=m.group(1),m.group(2)
              g=lambda k,s: (re.search(k+r'="([^"]*)"',s) or [None,''])[1]
              sev,i=g('severity',a),g('id',a)
              if sev in ('Error','Fatal') or any(k in i for k in ('Leanback','Touchscreen','Hardware','Focus','Permission','Banner','Television')):
                  print(sev,i,'|',g('message',a)[:200],'|',g('file',l).split('/app/')[-1]+':'+g('line',l))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint
          path: app/build/reports/lint-results-debug.*
