name: TV check

# Run by hand: install the latest test build on Android TV emulators, drive it with the
# remote's keys, and save screenshots and any crash log. Also runs Android Lint for TV issues.
on:
  workflow_dispatch:
    inputs:
      list_images:
        description: "Only list the TV emulator images"
        required: false
        default: "false"

jobs:
  images:
    if: inputs.list_images == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list 2>/dev/null | grep -iE "system-images;android-[0-9]+;(android-tv|google-tv)" | sort -u

  tv:
    if: inputs.list_images != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Android 9 is what Fire TV (Fire OS 7) is built on; Google TV 14 is current Android TV.
        include:
          - name: android9-tv
            api: 28
            target: android-tv
          - name: googletv14
            api: 34
            target: google-tv
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Latest test build
        run: gh release download test-latest -p VantaView-test.apk -R ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          script: bash .github/tv/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-${{ matrix.name }}
          path: tv-out

  lint:
    if: inputs.list_images != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle --no-daemon lintDebug -Plint.abortOnError=false || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint
          path: app/build/reports/lint-results-debug.*
